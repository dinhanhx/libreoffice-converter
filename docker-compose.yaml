services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - libreoffice-converter

  libreoffice-converter:
    build:
      context: .
      dockerfile: Dockerfile
    image: libreoffice-converter:latest
    volumes:
      - .:/app
    environment:
      UVICORN_WORKERS: 4
      SOFFICE_TIMEOUT: 300
      MAX_UPLOAD_BYTES: 52428800
