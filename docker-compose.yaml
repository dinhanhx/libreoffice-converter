services:
  caddy:
    container_name: libreoffice
    image: caddy:2
    ports:
      - "9700:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      fastapi:
        condition: service_healthy

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: libreoffice-fastapi:latest
    volumes:
      - .:/app
    environment:
      FASTAPI_OFFLINE: true
      UVICORN_WORKERS: 4
      SOFFICE_TIMEOUT: 300
      MAX_UPLOAD_BYTES: 52428800
      MAX_CONCURRENT_CONVERSIONS: 10
      SWEEP_INTERVAL_SECONDS: 600
      TEMP_MAX_AGE_SECONDS: 3600
      REDIS_URL: redis://redis:6379/0
      MAX_QUEUE_SIZE: 120
      QUEUE_TIMEOUT_SECONDS: 300
      QUEUE_POLL_INTERVAL_MS: 200
      PREP_DOCX: true
      STRIP_RSIDS: true
      FLATTEN_MERGED_CELLS: true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4.10-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
